<app-player *ngFor="let player of game.players; let i = index" [name]="player" class="player-position" [style.top.px]="130 + (i * 90)" [playerActive]="i === game.currentPlayer"></app-player>

<div class="field">

    <div class="card-stack">
        <img *ngFor="let c of [1,2,3,4]; let i = index" [ngStyle]="{'right.px': i * 5}" src="/assets/img/card_cover.png" alt="">
        <img (click)="drawCard()"class="top-card" style="right: 25px" src="/assets/img/card_cover.png" alt="">        
        <img *ngFor="let card of game.playedCards" class="played-card" src="/assets/img/{{ card }}.png" alt="">
        <img (click)="drawCard()" *ngIf="pickCardAnimation" class="pick-card" style="right: 25px" src="/assets/img/{{ currentCard }}.png" alt="">
    </div>
</div>

<app-game-description class="pin-bottom"></app-game-description>

<button mat-fab color="primary" (click)="openDialog()" class="btn-add">
    <mat-icon>add</mat-icon>
</button>
